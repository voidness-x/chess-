<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chess</title>
    <link href="style.css" rel="stylesheet"></link>
  </head>
  <body>
    <script src="p5.js"></script>
    <div class="app">
      <nav class="navbar">
        <button class="btn" type="button" onclick="toggleTheme()">Change Theme</button>
        <div id="turnText" class="turn-text">Whites turn</div>
      </nav>
      <div id="board-container">
        <div id="board-grid">
          <div id="ranksCol" class="board-labels board-labels-ranks">
            <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
          </div>
          <div id="board-canvas-slot">
            <div id="gameOverOverlay" class="game-over-overlay" hidden>
              <div class="game-over-card">
                <div id="gameOverText"></div>
                <button class="btn" type="button" onclick="resetGame()">Rematch</button>
              </div>
            </div>
          </div>
          <div class="board-labels-corner"></div>
          <div id="filesRow" class="board-labels board-labels-files">
            <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
